<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!-- HEADER -->

    <header>

        <div class="contenedor barra-nav">

            <div class="logo">Talento<span> Tech</span> Store</div>

            <nav>
                <ul class="menu">
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#productos">Productos</a></li>
                    <li><a href="#ofertas">Ofertas</a></li>
                    <li><a href="#contacto"></a>Contacto</li>
                    <li><a href="#">Carrito</a></li>
                </ul>
            </nav>

        </div>

    </header>

<!-- MAIN -->

    <main>

        <section class="hero">
            <h1>LO ULTIMO 2026</h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Commodi, ipsam.</p>
            <a href="#productos" class="boton">Ver productos</a>
        </section>

        <section id="productos" class="contenedor">
            <h2 class="titulo-section">Nuestros productos</h2>

            <div class="grilla-productos">

                <!-- CARD 1 -->

                <article class="card">
                    <img src="https://placehold.co/600x400/transparent/F00" alt="Producto">
                    <div class="card-info">
                        <span class="categoria">Opciones</span>
                        <h3>Explicación de producto</h3>
                        <p>Detalles del producto</p>
                        <span class="precio">$20.000</span>
                        <button>Agregar al carrito</button>
                    </div>
                </article>

            </div>
        </section>

    </main>

</body>
</html>
